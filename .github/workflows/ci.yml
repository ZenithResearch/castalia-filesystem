name: Filesystem candidate checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install nightly-2026-06-21 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo fetch --locked
      - run: node scripts/verify-extraction.mjs
      - run: node --test tests/*.test.mjs
      - run: cargo test --workspace --all-targets --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path castalia-filesystem-wasm/Cargo.toml -- --check
      - run: cargo check -p castalia-filesystem-core --target wasm32-unknown-unknown --locked --offline
  wasm-candidate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned build tools
        run: |
          rustup toolchain install nightly-2026-06-21 --profile minimal --target wasm32-unknown-unknown
          cargo +nightly-2026-06-21 install wasm-pack --version 0.14.0 --locked
          cargo +nightly-2026-06-21 install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Fetch only reviewed dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path castalia-filesystem-wasm/Cargo.toml --locked
      - name: Verify source and build immutable candidate
        id: candidate
        run: |
          node scripts/verify-extraction.mjs
          node scripts/build-package.mjs --out-dir "$RUNNER_TEMP/filesystem-candidate"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload candidate bytes without publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: castalia-filesystem-${{ steps.candidate.outputs.revision }}-${{ matrix.os }}
          path: ${{ runner.temp }}/filesystem-candidate
          include-hidden-files: true
          if-no-files-found: error

  reproducibility:
    needs: wasm-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: castalia-filesystem-*
          path: ${{ runner.temp }}/independent-candidates
      - run: node scripts/compare-candidate-manifests.mjs "$RUNNER_TEMP/independent-candidates" "$(git rev-parse HEAD)"
