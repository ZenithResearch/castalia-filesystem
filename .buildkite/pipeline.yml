{
  "steps": [
    {
      "label": ":crab: Filesystem native source and fixtures",
      "key": "native",
      "command": "bash .buildkite/source-gates.sh native",
      "agents": { "queue": "linux-medium" },
      "timeout_in_minutes": 45
    },
    {
      "label": ":globe_with_meridians: Filesystem WASM golden-fixture parity",
      "key": "wasm",
      "command": "bash .buildkite/source-gates.sh wasm",
      "agents": { "queue": "linux-medium" },
      "timeout_in_minutes": 60
    },
    {
      "label": ":white_check_mark: Public source ready",
      "key": "filesystem-source-ready",
      "depends_on": ["native", "wasm"],
      "command": "bash .buildkite/source-gates.sh ready",
      "agents": { "queue": "linux-medium" },
      "timeout_in_minutes": 5
    }
  ]
}
