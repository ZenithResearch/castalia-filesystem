[package]
name = "castalia-filesystem-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ZenithResearch/castalia-filesystem"
description = "Browser Worker bridge for Castalia immutable filesystem snapshots"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
castalia-filesystem-core = { path = "../castalia-filesystem-core" }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace]
resolver = "3"
